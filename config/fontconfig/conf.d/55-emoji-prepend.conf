<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "../fonts.dtd">
<fontconfig>
  <!-- Use Noto Color Emoji as a fallback in Chromium, not as the primary font.
       Prepending (the previous version) made Chromium shape space characters
       with the emoji font, producing huge word gaps. -->
  <match>
    <test name="prgname">
      <string>chromium</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
